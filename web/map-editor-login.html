<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录地图编辑器 · 长春 2027 大冬会冰雪漫游</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#e7f1f3;color:#163c48;font:14px/1.5 system-ui,'Microsoft YaHei',sans-serif}
    main{width:min(380px,100%);padding:30px;border:1px solid #d4e5e8;border-radius:20px;background:#fff;box-shadow:0 20px 50px #24566b1b}h1{font-size:22px;margin:0 0 6px}p{color:#64808a;margin:0 0 24px}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #afc8ce;border-radius:10px;font:inherit}button{width:100%;margin-top:17px;padding:12px;border:0;border-radius:10px;background:#167d83;color:#fff;font:inherit;font-weight:700;cursor:pointer}small{display:block;min-height:20px;color:#b03535;margin-top:11px}
  </style>
</head>
<body><main><h1>地图图标编辑器</h1><p>请输入编辑密码后调整景点和人物大小。</p><form id="login"><label for="password">登录密码</label><input id="password" type="password" autocomplete="current-password" required autofocus><button type="submit">登录编辑器</button><small id="error" role="alert"></small></form></main>
<script>
document.getElementById('login').addEventListener('submit',async event=>{
  event.preventDefault();
  const button=event.target.querySelector('button');button.disabled=true;
  try{
    const response=await fetch('/api/map-editor/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});
    const result=await response.json();
    if(!response.ok)throw new Error(result.error||'登录失败');
    location.reload();
  }catch(error){document.getElementById('error').textContent=error.message;button.disabled=false;}
});
</script></body>
</html>
